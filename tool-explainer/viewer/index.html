    --font-head:'Syne',sans-serif; --font-body:'DM Sans',sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--bg); color:var(--text); font-family:var(--font-body); }

  /* ── TOPBAR ── */
  #topbar {
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 12px; gap:8px; background:rgba(255,255,255,0.96);
    border-bottom:1px solid var(--border); backdrop-filter:blur(10px);
    height:52px;
  }
  .brand { display:flex; align-items:center; gap:8px; cursor:pointer; min-width:0; }
  .brand .sena { height:34px; }
  .logo { font-family:var(--font-head); font-size:13px; font-weight:800; line-height:1.1; max-width:150px; }
  .logo span { color:var(--accent); }
  #tool-badge {
    font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
    background:var(--accent); color:#fff; padding:4px 10px; border-radius:20px; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #repeat-btn {
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    padding:6px 12px; border-radius:8px; font-size:13px; cursor:pointer;
    font-family:var(--font-body);
  }

  /* ═══════════════════════════════════════════
     GALLERY MODE (sin ?id= en URL)
  ═══════════════════════════════════════════ */
  #gallery-view {
    display:none; padding-top:52px; min-height:100vh;
    overflow-y:auto;
  }
  #gallery-view.active { display:block; }

  .gallery-hero {
    background:linear-gradient(135deg,#ffffff 0%,#eef7ee 100%);
    padding:2.5rem 1.5rem 2rem;
    border-bottom:1px solid var(--border);
    text-align:center;
  }
  .gallery-hero h1 { font-family:var(--font-head); font-size:28px; font-weight:800; margin-bottom:6px; }
  .gallery-hero p { color:var(--muted); font-size:14px; }
  .gallery-stats {
    display:flex; gap:1.5rem; justify-content:center; margin-top:1.25rem;
    flex-wrap:wrap;
  }
  .g-stat { text-align:center; }
  .g-stat .val { font-family:var(--font-head); font-size:24px; font-weight:800; color:var(--accent); }
  .g-stat .lbl { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }


  /* ── MARCA: logos SENA / TecnoAcademia ── */
  .brand-img { mix-blend-mode:multiply; display:block; background-repeat:no-repeat; background-position:center; background-size:contain; flex-shrink:0; }
  .brand-img.tecno { background-image:var(--img-tecno); aspect-ratio:589/118; }
  .brand-img.combo { background-image:var(--img-combo); aspect-ratio:589/367; }
  .brand-img.sena  { background-image:var(--img-sena);  aspect-ratio:227/220; }
  .hero-logos { display:flex; align-items:center; justify-content:center; gap:1.25rem; margin-bottom:1.25rem; }
  .hero-logos .tecno { height:40px; }
  .hero-logos .sena { height:46px; }

  /* Filtros búsqueda */
  .gallery-search {
    padding:1.25rem 1.5rem 0.75rem;
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  }
  .gallery-search input {
    flex:1; min-width:180px;
    background:var(--card); border:1px solid var(--border);
    border-radius:8px; color:var(--text); font-family:var(--font-body);
    font-size:14px; padding:9px 14px; outline:none;
    transition:border-color 0.15s;
  }
  .gallery-search input:focus { border-color:var(--accent); }
  .gallery-search input::placeholder { color:var(--muted); }

  /* Líneas/Áreas */
  .gallery-body { padding:0 1.5rem 3rem; }

  .line-section { margin-bottom:2rem; }
  .line-header {
    display:flex; align-items:center; gap:10px;
    padding:0.75rem 0; margin-bottom:0.75rem;
    border-bottom:2px solid var(--border);
    cursor:pointer; user-select:none;
  }
  .line-icon { font-size:20px; }
  .line-name { font-family:var(--font-head); font-size:16px; font-weight:700; }
  .line-count { font-size:11px; color:var(--muted); margin-left:auto; }
  .line-toggle { font-size:12px; color:var(--muted); transition:transform 0.2s; }
  .line-toggle.collapsed { transform:rotate(-90deg); }

  .line-body { overflow:hidden; transition:max-height 0.3s ease; }
  .line-machines {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:0.75rem;
  }
  .line-children { margin:1rem 0 0 8px; padding-left:14px; border-left:2px solid var(--border); }
  .line-section.sub { margin-bottom:1.25rem; }
  .line-section.sub .line-name { font-size:15px; }

  /* Tarjeta de nodo en galería */
  .g-machine-card {
    background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:1.1rem 1rem; cursor:pointer;
    transition:border-color 0.2s, transform 0.2s;
    animation:fadeUp 0.3s ease both;
    display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px;
  }
  .g-machine-card:hover { border-color:var(--accent); transform:translateY(-2px); }
  @keyframes fadeUp { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
  .g-card-icon { font-size:32px; line-height:1; }
  .g-card-name { font-family:var(--font-head); font-size:14px; font-weight:700; line-height:1.3; }
  .g-card-cat { font-size:10px; color:var(--accent); text-transform:uppercase; letter-spacing:0.7px; font-weight:600; }

  /* Sin nodos */
  .gallery-empty { text-align:center; padding:3rem; color:var(--muted); }
  .gallery-empty .icon { font-size:40px; margin-bottom:1rem; opacity:0.4; }
  .gallery-empty h3 { font-family:var(--font-head); color:var(--text); margin-bottom:6px; }

  /* ═══════════════════════════════════════════
     VIEWER MODE (con ?id= en URL)
  ═══════════════════════════════════════════ */
  #viewer-wrap {
    display:none; position:fixed; top:52px; left:0; right:0; bottom:0;
    flex-direction:column;
  }
  #viewer-wrap.active { display:flex; }

  /* Model-Viewer */
  #mv-container {
    position:relative; flex:1; min-height:0; background:var(--bg); overflow:hidden;
  }
  model-viewer {
    width:100%; height:100%; background-color:transparent; --poster-color:transparent;
  }
  model-viewer::part(default-ar-button) {
    bottom:90px !important; right:16px !important;
    background:var(--accent) !important; color:#fff !important;
    border-radius:50px !important; padding:12px 22px !important;
    font-family:var(--font-head) !important; font-weight:800 !important;
    border:none !important; font-size:15px !important;
    box-shadow:0 4px 20px rgba(47,158,44,0.5) !important;
  }
  model-viewer::part(default-progress-bar) { background:var(--accent); height:3px; }

  #tool-title-float {
    position:absolute; top:14px; left:16px;
    font-family:var(--font-head); font-size:22px; font-weight:800;
    text-shadow:0 1px 6px rgba(255,255,255,0.9); pointer-events:none;
  }
  #tool-cat-float {

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── PARAMS ──────────────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const machineId = params.get('id');
const isPreview = params.get('preview') === '1';

// ─── STATE ───────────────────────────────────────────────────────────
let allMachines = [];
let allLines = [];

// ─── DEBUG ───────────────────────────────────────────────────────────
function showDebug(msg) { console.log('[RedDesarrollosInteligentes]', msg); }

// ─── INDEXEDDB ───────────────────────────────────────────────────────
const DB_NAME='tallerscan_db', DB_VER=1, STORE_NAME='glb_store';
function openDB() {
  return new Promise((res,rej)=>{
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=e=>e.target.result.createObjectStore(STORE_NAME);
    req.onsuccess=e=>res(e.target.result);
    req.onerror=e=>rej(e.target.error);
  });
}
function dbGet(id) {
  return openDB().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(STORE_NAME,'readonly');
    const req=tx.objectStore(STORE_NAME).get('glb_'+id);
    req.onsuccess=e=>res(e.target.result||null);
    req.onerror=()=>res(null);
  }));
}

// ─── STORAGE ─────────────────────────────────────────────────────────
async function loadAllData() {
  // 1. localStorage (mismo navegador que admin)
  try {
    const rawM = localStorage.getItem('tallerscan_meta');
    const rawL = localStorage.getItem('tallerscan_lines');
    if(rawM) {
      allMachines = JSON.parse(rawM).map(m=>({...m, glbData:null}));
      allLines = rawL ? JSON.parse(rawL) : [];
      showDebug('Datos cargados desde localStorage: ' + allMachines.length + ' nodos');
      return;
    }
  } catch(e) {}

  // 2. data.json (GitHub Pages / servidor)
  const href = window.location.href.split('?')[0].split('#')[0];
  const viewerDir = href.substring(0, href.lastIndexOf('/') + 1);
  const dataUrl = viewerDir + 'data.json';
  showDebug('Buscando datos en: ' + dataUrl);
  try {
    const resp = await fetch(dataUrl + '?t=' + Date.now());
    if(resp.ok) {
      const data = await resp.json();
      if(Array.isArray(data)) {
        // Formato antiguo: solo array de nodos
        allMachines = data;
        allLines = [];
      } else {
        // Formato nuevo: { machines, lines }
        allMachines = data.machines || [];
        allLines = data.lines || [];
      }
      showDebug('data.json cargado: ' + allMachines.length + ' nodos, ' + allLines.length + ' líneas');
    }
  } catch(e) {
    showDebug('Error cargando data.json: ' + e.message);
  }
}

async function getMachineFromStorage(id) {
  await loadAllData();
  const m = allMachines.find(m => m.id === id);
  if(!m) return null;
  if(m.hasGlb && !m.glbData) {
    try { m.glbData = await dbGet(id); } catch(e) {}
  }
  return m;
}

// ─── GALLERY MODE ─────────────────────────────────────────────────────
async function initGallery() {
  document.getElementById('gallery-view').classList.add('active');
  document.getElementById('tool-badge').textContent = 'GALERÍA';
  document.getElementById('repeat-btn').style.display = 'none';

  await loadAllData();
  renderGallery(allMachines, allLines);
}

function renderGallery(machines, lines, search='') {
  const body = document.getElementById('gallery-body');

  // Stats
  document.getElementById('g-total').textContent = machines.length;
  document.getElementById('g-lines').textContent = lines.length;
  document.getElementById('g-cats').textContent = new Set(machines.map(m=>m.cat)).size;

  if(!machines.length) {
    body.innerHTML = `<div class="gallery-empty"><div class="icon">🔧</div><h3>Sin nodos aún</h3><p>El administrador no ha agregado nodos todavía.</p></div>`;
    return;
  }

  const q = search.toLowerCase().trim();

  // Agrupar por línea
  const lineMap = {}; // lineId -> [machines]
  const noLine = [];

  machines.forEach(m => {
    const match = !q || m.name.toLowerCase().includes(q) || m.cat.toLowerCase().includes(q) || (m.lineName||'').toLowerCase().includes(q);
    if(!match) return;
    if(m.lineId) {
      if(!lineMap[m.lineId]) lineMap[m.lineId] = [];
      lineMap[m.lineId].push(m);
    } else {
      noLine.push(m);
    }
  });

  let html = '';

  // Renderizar líneas configuradas como árbol (líneas dentro de líneas)
  const ids = new Set(lines.map(l => l.id));
  const kidsOf = pid => lines.filter(l => l.id !== pid && l.parentId === pid);
  const seen = new Set();
  const build = (line, depth) => {
    if(seen.has(line.id)) return { html:'', count:0 };
    seen.add(line.id);
    const own = lineMap[line.id] || [];
    let childHtml = '', total = own.length;
    kidsOf(line.id).forEach(k => { const r = build(k, depth + 1); childHtml += r.html; total += r.count; });
    if(q && total === 0) return { html:'', count:0 }; // en búsqueda, ocultar líneas vacías
    return { html: renderLineSection(line, own, childHtml, total, depth), count: total };
  };
  lines.filter(l => !l.parentId || l.parentId === l.id || !ids.has(l.parentId)).forEach(l => { html += build(l, 0).html; });
  lines.forEach(l => { if(!seen.has(l.id)) html += build(l, 0).html; }); // rescata datos con ciclos

  // Nodos sin línea asignada
  if(noLine.length) {
    const fakeLine = { id:'__noline__', name:'Sin línea asignada', icon:'📦', color:'#6a6a80' };
    html += renderLineSection(fakeLine, noLine, '', noLine.length, 0);
  }

  // Si todo vacío por búsqueda
  if(!html) {
    html = `<div class="gallery-empty"><div class="icon">🔍</div><h3>Sin resultados</h3><p>No hay nodos que coincidan con "${search}"</p></div>`;
  }

  body.innerHTML = html;
}

function renderLineSection(line, machines, childrenHtml = '', total = machines.length, depth = 0) {
  const machineCards = machines.map(m => `
    <div class="g-machine-card" onclick="openMachineViewer('${m.id}')" style="animation-delay:${Math.random()*0.2}s">
      <div class="g-card-icon">${escHtml(m.icon||'🔧')}</div>
      <div class="g-card-name">${escHtml(m.name)}</div>
      <div class="g-card-cat">${escHtml(m.cat)}</div>
    </div>
  `).join('');

  const color = line.color || '#39a935';

  return `
    <div class="line-section${depth ? ' sub' : ''}" id="line-sec-${line.id}">
      <div class="line-header" onclick="toggleLine('${line.id}')" style="border-bottom-color:${color}22;">
        <span class="line-icon">${line.icon || '📁'}</span>
        <span class="line-name" style="color:${color}">${escHtml(line.name)}</span>
        <span class="line-count">${total} nodo${total!==1?'s':''}</span>
        <span class="line-toggle" id="toggle-${line.id}">▼</span>
      </div>
      <div class="line-body" id="machines-${line.id}">
        <div class="line-machines">
          ${machineCards || (childrenHtml ? '' : `<div style="color:var(--muted);font-size:13px;padding:1rem;">No hay nodos en esta línea.</div>`)}
        </div>
        ${childrenHtml ? `<div class="line-children" style="border-left-color:${color}44;">${childrenHtml}</div>` : ''}
      </div>
    </div>
  `;
}

function toggleLine(lineId) {
  const el = document.getElementById('machines-' + lineId);
  const toggle = document.getElementById('toggle-' + lineId);
  const isCollapsed = el.style.maxHeight === '0px';
  el.style.maxHeight = isCollapsed ? '' : '0px';
  toggle.classList.toggle('collapsed', !isCollapsed);
}

function filterGallery(q) {
  renderGallery(allMachines, allLines, q);
}

function openMachineViewer(id) {
  // Navegar al viewer con el ID
  const url = new URL(window.location.href);
  url.searchParams.set('id', id);
  window.location.href = url.toString();
}

function goToGallery() {
  const url = new URL(window.location.href);
  url.searchParams.delete('id');
  window.location.href = url.toString();
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── THREE.JS (fallback procedural) ──────────────────────────────────
let scene,camera,renderer,toolGroup,animId,threeInitialized=false;
let isDragging=false,prevMouse={x:0,y:0};

function initThree() {
  if(threeInitialized) return;
  threeInitialized=true;
  const canvas=document.getElementById('three-canvas');
  const wrap=document.getElementById('mv-container');
  canvas.style.display='block';
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  resizeRenderer();
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0xffffff);
  scene.fog=new THREE.FogExp2(0xffffff,0.06);
  camera=new THREE.PerspectiveCamera(45,wrap.clientWidth/wrap.clientHeight,0.1,200);
  camera.position.set(0,1.8,5.5); camera.lookAt(0,0.5,0);
  scene.add(new THREE.AmbientLight(0xffffff,0.35));
  const d1=new THREE.DirectionalLight(0xffffff,0.9); d1.position.set(4,6,4); d1.castShadow=true; scene.add(d1);
  scene.add(new THREE.DirectionalLight(0x3de0f0,0.3).position.set(-4,2,-3));
  const acc=new THREE.PointLight(0xc8f03d,0.5,10); acc.position.set(0,3,2); scene.add(acc);
  scene.add(new THREE.GridHelper(20,30,0xc9d6c9,0xe3ebe3));
  canvas.addEventListener('mousedown',e=>{isDragging=true;prevMouse={x:e.clientX,y:e.clientY};});
  window.addEventListener('mouseup',()=>isDragging=false);
  window.addEventListener('mousemove',e=>{
    if(!isDragging||!toolGroup)return;
    const dx=e.clientX-prevMouse.x, dy=e.clientY-prevMouse.y;
    toolGroup.rotation.y+=dx*0.012;
    toolGroup.rotation.x+=dy*0.012;
    prevMouse={x:e.clientX,y:e.clientY};
  });
  canvas.addEventListener('touchstart',e=>{isDragging=true;prevMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
  window.addEventListener('touchend',()=>isDragging=false);
  window.addEventListener('touchmove',e=>{
    if(!isDragging||!toolGroup)return;
    const dx=e.touches[0].clientX-prevMouse.x, dy=e.touches[0].clientY-prevMouse.y;
    toolGroup.rotation.y+=dx*0.012;
    toolGroup.rotation.x+=dy*0.012;
    prevMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};
  },{passive:true});
  window.addEventListener('resize',resizeRenderer);
  (function loop(){
    animId=requestAnimationFrame(loop);
    if(toolGroup&&!isDragging) toolGroup.rotation.y+=0.003;
    renderer.render(scene,camera);
  })();
}

function resizeRenderer(){
  if(!renderer)return;
  const wrap=document.getElementById('mv-container');
  renderer.setSize(wrap.clientWidth,wrap.clientHeight);
  if(camera){camera.aspect=wrap.clientWidth/wrap.clientHeight;camera.updateProjectionMatrix();}
}

function buildProceduralModel(type,color){
  const g=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color:new THREE.Color(color||'#39a935'),roughness:0.4,metalness:0.3});
  if(type==='drill'){const b=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.5,2,16),mat);b.position.y=1;g.add(b);const h=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.15,1.5,8),mat);h.position.y=-0.25;g.add(h);}
  else{const b=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.8,1.2),mat);b.position.y=0.4;g.add(b);const p=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,1.5,16),mat);p.position.y=1.55;g.add(p);const base=new THREE.Mesh(new THREE.BoxGeometry(2,0.15,1.6),new THREE.MeshStandardMaterial({color:0x333344,roughness:0.8}));base.position.y=-0.075;g.add(base);}
  return g;
}

// ─── GLTF LOADER ─────────────────────────────────────────────────────
let gltfLoaderReady=false,gltfLoaderPromise=null;
function ensureGLTFLoader(){
  if(gltfLoaderReady)return Promise.resolve();
  if(gltfLoaderPromise)return gltfLoaderPromise;
  gltfLoaderPromise=new Promise((res,rej)=>{
    function loadMeshopt(cb){
      if(window.MeshoptDecoder){cb();return;}
      const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/meshoptimizer@0.18.1/meshopt_decoder.js';
      s.onload=()=>{if(window.MeshoptDecoder)window.MeshoptDecoder.ready.then(cb).catch(cb);else cb();};
      s.onerror=cb; document.head.appendChild(s);
    }
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
    s.onload=()=>{loadMeshopt(()=>{gltfLoaderReady=true;res();});};
    s.onerror=rej; document.head.appendChild(s);
  });
  return gltfLoaderPromise;
}

function scaleGLTF(scene){
  const box=new THREE.Box3().setFromObject(scene);
  const size=box.getSize(new THREE.Vector3());
  const maxDim=Math.max(size.x,size.y,size.z);
  const sc=2.5/(maxDim||1);
  scene.scale.setScalar(sc);
  const ctr=box.getCenter(new THREE.Vector3());
  scene.position.sub(ctr.multiplyScalar(sc));
  scene.position.y+=0.5;
  return scene;
}

function loadGLBLocal(source){
  return ensureGLTFLoader().then(()=>new Promise((res,rej)=>{
    const loader=new THREE.GLTFLoader();
    if(source.startsWith('http')||source.startsWith('blob')){
      loader.load(source,g=>res(scaleGLTF(g.scene)),undefined,rej);
    } else {
      const byteStr=atob(source.split(',')[1]);
      const ab=new ArrayBuffer(byteStr.length);
      const ia=new Uint8Array(ab);
      for(let i=0;i<byteStr.length;i++)ia[i]=byteStr.charCodeAt(i);
      const blob=new Blob([ab],{type:'model/gltf-binary'});
      const url=URL.createObjectURL(blob);
      loader.load(url,g=>{URL.revokeObjectURL(url);res(scaleGLTF(g.scene));},undefined,rej);
    }
  }));
}

// ─── PERSONAJE ANIME ──────────────────────────────────────────────────
let charCtx, isTalking=false, mouthState=0, blinkCounter=0, charFrame=0, mouthInterval=null;
let bodyBob=0, armSwing=0, eyeGlow=0;

function initChar() {
  const c = document.getElementById('char-canvas');
  if(!c) return;
  charCtx = c.getContext('2d');
  drawChar();
  setInterval(()=>{ blinkCounter++; charFrame++; bodyBob=Math.sin(charFrame*0.18)*3; armSwing=Math.sin(charFrame*0.22)*8; eyeGlow=0.5+0.5*Math.sin(charFrame*0.3); drawChar(); }, 80);
}

function setTalkingAnim(talking) {
  isTalking = talking;
  const wrap = document.getElementById('char-wrap');
  if(wrap) wrap.classList.toggle('talking', talking);
}

function drawChar() {
  if(!charCtx) return;
  const ctx=charCtx, W=180, H=320;
  ctx.clearRect(0,0,W,H);
  const cx=90, bob=bodyBob;
  ctx.fillStyle='rgba(200,240,61,0.12)';
  ctx.beginPath();ctx.ellipse(cx,H-8,30,7,0,0,Math.PI*2);ctx.fill();
  const legY=220+bob;
  ctx.fillStyle='#1a2535';
  ctx.beginPath();ctx.roundRect(cx-28,legY,22,60,6);ctx.fill();
  ctx.beginPath();ctx.roundRect(cx+6,legY,22,60,6);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.07)';
  ctx.fillRect(cx-26,legY+3,6,50);ctx.fillRect(cx+8,legY+3,6,50);
  ctx.fillStyle='#0d0d0d';
  ctx.beginPath();ctx.roundRect(cx-32,legY+54,28,16,[4,8,8,4]);ctx.fill();
  ctx.beginPath();ctx.roundRect(cx+4,legY+54,28,16,[4,8,8,4]);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.15)';
  ctx.beginPath();ctx.ellipse(cx-18,legY+57,9,3,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(cx+18,legY+57,9,3,0,0,Math.PI*2);ctx.fill();
  const bodyY=140+bob;
  const bodyGrad=ctx.createLinearGradient(cx-36,bodyY,cx+36,bodyY+80);
  bodyGrad.addColorStop(0,'#5dd400');bodyGrad.addColorStop(0.5,'#3ea800');bodyGrad.addColorStop(1,'#217000');
  ctx.fillStyle=bodyGrad;
  ctx.beginPath();ctx.roundRect(cx-36,bodyY,72,82,12);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.beginPath();ctx.roundRect(cx-20,bodyY+14,40,24,6);ctx.fill();
  ctx.fillStyle='#FFD100';
  ctx.font='bold 10px Arial Black,Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('SENA',cx,bodyY+26);
  ctx.fillStyle='#FFD100';ctx.fillRect(cx-36,bodyY+76,72,6);
  ctx.fillStyle='rgba(255,255,255,0.09)';
  ctx.beginPath();ctx.roundRect(cx-28,bodyY+8,32,22,5);ctx.fill();
  const skin='#f5c090';
  const armLAngle=isTalking?armSwing*0.04:0.05;
  ctx.save();ctx.translate(cx-36,bodyY+12);ctx.rotate(armLAngle);
  ctx.fillStyle='#3ea800';ctx.beginPath();ctx.roundRect(-18,0,18,52,8);ctx.fill();
  ctx.fillStyle='#FFD100';ctx.fillRect(-18,42,18,5);
  ctx.fillStyle=skin;ctx.beginPath();ctx.ellipse(-9,58,10,12,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.22)';ctx.beginPath();ctx.ellipse(-13,53,4,4,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
  const armRAngle=isTalking?-armSwing*0.04:-0.05;
  ctx.save();ctx.translate(cx+36,bodyY+12);ctx.rotate(armRAngle);
  ctx.fillStyle='#3ea800';ctx.beginPath();ctx.roundRect(0,0,18,52,8);ctx.fill();
  ctx.fillStyle='#FFD100';ctx.fillRect(0,42,18,5);
  ctx.fillStyle=skin;ctx.beginPath();ctx.ellipse(9,58,10,12,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.22)';ctx.beginPath();ctx.ellipse(13,53,4,4,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.fillStyle=skin;ctx.beginPath();ctx.roundRect(cx-10,bodyY-16,20,20,4);ctx.fill();
  const headY=bodyY-88+bob*0.5;
  ctx.fillStyle='rgba(0,0,0,0.18)';ctx.beginPath();ctx.roundRect(cx-42,headY+4,84,82,20);ctx.fill();
  const faceG=ctx.createRadialGradient(cx,headY+38,6,cx,headY+38,48);
  faceG.addColorStop(0,'#fde8c8');faceG.addColorStop(1,'#f0b87a');
  ctx.fillStyle=faceG;ctx.beginPath();ctx.roundRect(cx-40,headY,80,80,20);ctx.fill();
  ctx.fillStyle='#150900';ctx.beginPath();ctx.roundRect(cx-42,headY-4,84,44,[20,20,0,0]);ctx.fill();
  ctx.beginPath();ctx.moveTo(cx-42,headY+28);ctx.lineTo(cx-54,headY+62);ctx.lineTo(cx-36,headY+48);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(cx+42,headY+28);ctx.lineTo(cx+54,headY+62);ctx.lineTo(cx+36,headY+48);ctx.closePath();ctx.fill();
  ctx.fillStyle='#1e0d00';
  ctx.beginPath();ctx.moveTo(cx-30,headY);ctx.lineTo(cx-22,headY+28);ctx.lineTo(cx-8,headY+6);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(cx-8,headY-2);ctx.lineTo(cx,headY+22);ctx.lineTo(cx+14,headY+2);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(cx+14,headY-2);ctx.lineTo(cx+22,headY+24);ctx.lineTo(cx+36,headY+4);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.13)';ctx.beginPath();ctx.ellipse(cx-8,headY+8,20,6,-0.3,0,Math.PI*2);ctx.fill();
  const eyeY=headY+42;
  const blink=blinkCounter%35<2;
  if(blink){
    ctx.strokeStyle='#2a1200';ctx.lineWidth=3;ctx.lineCap='round';
    ctx.beginPath();ctx.arc(cx-16,eyeY,10,Math.PI+0.3,-0.3);ctx.stroke();
    ctx.beginPath();ctx.arc(cx+16,eyeY,10,Math.PI+0.3,-0.3);ctx.stroke();
  } else {
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.ellipse(cx-16,eyeY,12,14,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx+16,eyeY,12,14,0,0,Math.PI*2);ctx.fill();
    const irisColor=isTalking?'#00c8a0':'#1570c8';
    ctx.fillStyle=irisColor;
    ctx.beginPath();ctx.ellipse(cx-16,eyeY+1,9,11,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx+16,eyeY+1,9,11,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#040414';
    ctx.beginPath();ctx.ellipse(cx-16,eyeY+2,5,7,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx+16,eyeY+2,5,7,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.ellipse(cx-20,eyeY-3,3.5,3.5,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx+12,eyeY-3,3.5,3.5,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#1a0900';ctx.lineWidth=2.5;ctx.lineCap='round';
    ctx.beginPath();ctx.arc(cx-16,eyeY,12,Math.PI+0.1,-0.1);ctx.stroke();
    ctx.beginPath();ctx.arc(cx+16,eyeY,12,Math.PI+0.1,-0.1);ctx.stroke();
    ctx.fillStyle='#1a0900';
    ctx.save();ctx.translate(cx-28,eyeY-20);ctx.rotate(-0.1);ctx.beginPath();ctx.roundRect(0,0,24,5,3);ctx.fill();ctx.restore();
    ctx.save();ctx.translate(cx+4,eyeY-20);ctx.rotate(0.1);ctx.beginPath();ctx.roundRect(0,0,24,5,3);ctx.fill();ctx.restore();
  }
  ctx.strokeStyle='#c08060';ctx.lineWidth=1.8;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx-3,eyeY+16);ctx.lineTo(cx+3,eyeY+16);ctx.stroke();
  ctx.strokeStyle='#b05030';ctx.lineWidth=2.8;ctx.lineCap='round';
  if(isTalking){
    const m=mouthState%6;
    if(m<2){
      ctx.fillStyle='#6a0808';ctx.beginPath();ctx.ellipse(cx,eyeY+28,11,9,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#d05050';ctx.beginPath();ctx.ellipse(cx,eyeY+27,7,5,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.fillRect(cx-8,eyeY+21,7,5);ctx.fillRect(cx+1,eyeY+21,7,5);
    } else if(m<4){
      ctx.beginPath();ctx.arc(cx,eyeY+24,10,0.2,Math.PI-0.2);ctx.stroke();
      ctx.fillStyle='rgba(255,100,100,0.28)';
      ctx.beginPath();ctx.ellipse(cx-26,eyeY+12,11,6,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(cx+26,eyeY+12,11,6,0,0,Math.PI*2);ctx.fill();
    } else {
      ctx.beginPath();ctx.arc(cx,eyeY+22,10,0.1,Math.PI-0.1);ctx.stroke();
    }
  } else {
    ctx.beginPath();ctx.arc(cx,eyeY+24,8,0.2,Math.PI-0.2);ctx.stroke();
    ctx.fillStyle='rgba(255,120,120,0.14)';
    ctx.beginPath();ctx.ellipse(cx-26,eyeY+12,10,5,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx+26,eyeY+12,10,5,0,0,Math.PI*2);ctx.fill();
  }
  const antY=headY-2;
  ctx.strokeStyle='#c8f03d';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.arc(cx,headY+2,46,Math.PI+0.35,-0.35);ctx.stroke();
  ctx.strokeStyle='#c8f03d';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(cx,antY-2);ctx.lineTo(cx,antY-18);ctx.stroke();
  if(isTalking){
    const glow=ctx.createRadialGradient(cx,antY-20,1,cx,antY-20,12);
    glow.addColorStop(0,`rgba(200,240,61,${0.8*eyeGlow})`);
    glow.addColorStop(1,'rgba(200,240,61,0)');
    ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,antY-20,12,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle='#c8f03d';ctx.beginPath();ctx.arc(cx,antY-20,6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.7)';ctx.beginPath();ctx.arc(cx-2,antY-22,2.2,0,Math.PI*2);ctx.fill();
}

// ─── AR ───────────────────────────────────────────────────────────────
function activarAR() {
  const mv = document.getElementById('main-mv');
  if(!mv || !mv.src) return;
  if(/android/i.test(navigator.userAgent)) {
    const url = `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(mv.src)}&mode=ar_preferred&title=${encodeURIComponent(document.getElementById('tool-title-float').textContent)}#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=${encodeURIComponent(mv.src)};end;`;
    window.location.href = url; return;
  }
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)) {
    const a = document.createElement('a');
    a.href = mv.src; a.rel = 'ar';
    a.appendChild(document.createElement('img'));
    document.body.appendChild(a); a.click(); document.body.removeChild(a); return;
  }
  alert('La Realidad Aumentada está disponible en Android Chrome o iPhone Safari');
}

// ─── VOZ ──────────────────────────────────────────────────────────────
let utterance=null,currentDesc='',pendingSpeech=null,voicesReady=false;
let audioUnlocked=false;

function unlockAndSpeak() {
  const overlay=document.getElementById('tap-overlay');
  if(overlay)overlay.style.display='none';
  audioUnlocked=true;
  if(pendingSpeech){doSpeak(pendingSpeech);pendingSpeech=null;}
}

function doSpeak(text){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  if(mouthInterval)clearInterval(mouthInterval);
  utterance=new SpeechSynthesisUtterance(text);
  utterance.lang='es-CO';utterance.rate=0.90;utterance.pitch=1.1;
  const voices=window.speechSynthesis.getVoices();
  const esVoice=voices.find(v=>v.lang==='es-CO')||voices.find(v=>v.lang==='es-US')||voices.find(v=>v.lang.startsWith('es')&&v.name.toLowerCase().includes('google'))||voices.find(v=>v.lang.startsWith('es'));
  if(esVoice)utterance.voice=esVoice;
  utterance.onstart=()=>{setTalkingAnim(true);mouthInterval=setInterval(()=>{mouthState++;},120);animateProgress(text.length*65);};
  utterance.onend=()=>{setTalkingAnim(false);if(mouthInterval){clearInterval(mouthInterval);mouthInterval=null;}document.getElementById('typing-cursor').style.display='none';document.getElementById('voice-progress').style.width='100%';};
  utterance.onerror=(e)=>{
    setTalkingAnim(false);
    if(e.error==='not-allowed'){
      pendingSpeech=text;
      const overlay=document.getElementById('tap-overlay');
      if(overlay)overlay.style.display='flex';
    }
  };
  window.speechSynthesis.speak(utterance);
  typeText(text);
}

function speak(text){
  if(!window.speechSynthesis)return;
  pendingSpeech=text;
  const voices=window.speechSynthesis.getVoices();
  if(voices.length>0){voicesReady=true;doSpeak(text);}
  else{
    window.speechSynthesis.onvoiceschanged=()=>{voicesReady=true;window.speechSynthesis.onvoiceschanged=null;if(pendingSpeech){doSpeak(pendingSpeech);pendingSpeech=null;}};
    setTimeout(()=>{if(!voicesReady&&pendingSpeech){voicesReady=true;doSpeak(pendingSpeech);pendingSpeech=null;}},1500);
  }
}

function animateProgress(duration){
  const bar=document.getElementById('voice-progress');
  bar.style.width='0%';bar.style.transition=`width ${duration}ms linear`;
  setTimeout(()=>bar.style.width='95%',50);
}

let typingTimer=null;
function typeText(text){
  const el=document.getElementById('text-out');
  const cur=document.getElementById('typing-cursor');
  cur.style.display='inline-block';el.textContent='';
  if(typingTimer)clearInterval(typingTimer);
  let i=0;
  typingTimer=setInterval(()=>{if(i<text.length){el.textContent+=text[i];i++;}else clearInterval(typingTimer);},28);
}

function repeatSpeech(){if(currentDesc)speak(currentDesc);}

// ─── CARGA DE NODO ────────────────────────────────────────────────
let loadToken=0;

async function loadMachine(machine){
  const myToken=++loadToken;
  document.getElementById('loading').style.display='flex';
  document.getElementById('model-fallback-tag').style.display='none';
  document.getElementById('tool-badge').textContent=machine.cat||'HERRAMIENTA';
  document.getElementById('tool-title-float').textContent=machine.name;
  document.getElementById('tool-cat-float').textContent=machine.cat;
  document.getElementById('repeat-btn').style.display='block';
  document.title=machine.name+' — Red de Desarrollos Inteligentes';
  currentDesc=machine.desc;

  const glbSource = machine.glbUrl || machine.glbData || null;
  const mv = document.getElementById('main-mv');

  if(glbSource) {
    mv.style.display='block';
    document.getElementById('three-canvas').style.display='none';
    mv.setAttribute('camera-controls','');mv.setAttribute('auto-rotate','');
    mv.setAttribute('auto-rotate-delay','3000');mv.setAttribute('ar','');
    mv.setAttribute('ar-modes','webxr scene-viewer quick-look');
    mv.setAttribute('shadow-intensity','1');
    mv.setAttribute('min-camera-orbit','-Infinity -Infinity auto');
    mv.setAttribute('max-camera-orbit','Infinity Infinity auto');
    mv.setAttribute('interaction-prompt','none');

    let modelUrl=null;
    if(glbSource.startsWith('data:')){
      try{
        const byteStr=atob(glbSource.split(',')[1]);
        const ab=new ArrayBuffer(byteStr.length);
        const ia=new Uint8Array(ab);
        for(let i=0;i<byteStr.length;i++)ia[i]=byteStr.charCodeAt(i);
        const blob=new Blob([ab],{type:'model/gltf-binary'});
        modelUrl=URL.createObjectURL(blob);
      }catch(e){modelUrl=glbSource;}
    } else { modelUrl=glbSource; }

    const loadingEl=document.getElementById('loading');
    await new Promise(res=>{
      let attempts=0; const maxAttempts=4; const retryDelay=8000;
      function tryLoad(){
        attempts++;
        const urlWithCache=modelUrl.startsWith('blob:')?modelUrl:modelUrl+(modelUrl.includes('?')?'&':'?')+'_t='+Date.now();
        mv.src='';
        setTimeout(()=>{mv.src=urlWithCache;},50);
        const onLoad=()=>{mv.removeEventListener('error',onError);res();};
        const onError=()=>{
          mv.removeEventListener('load',onLoad);
          if(attempts<maxAttempts){
            if(loadingEl)loadingEl.querySelector('p').textContent=`Modelo no disponible aún, reintentando... (${attempts}/${maxAttempts})`;
            setTimeout(tryLoad,retryDelay);
          } else {
            mv.style.display='none';
            document.getElementById('three-canvas').style.display='block';
            document.getElementById('model-fallback-tag').style.display='block';
            document.getElementById('model-fallback-tag').textContent='⚠️ Modelo no disponible aún';
            initThree();
            if(toolGroup){scene.remove(toolGroup);toolGroup=null;}
            toolGroup=buildProceduralModel('default',machine.color);
            scene.add(toolGroup);
            res();
          }
        };
        mv.addEventListener('load',onLoad,{once:true});
        mv.addEventListener('error',onError,{once:true});
      }
      tryLoad();
    });
  } else {
    mv.style.display='none';
    document.getElementById('three-canvas').style.display='block';
    document.getElementById('model-fallback-tag').style.display='block';
    initThree();
    if(toolGroup){scene.remove(toolGroup);toolGroup=null;}
    const cat=(machine.cat||'').toLowerCase();
    let type=cat.includes('perfor')||cat.includes('drill')?'drill':'default';
    toolGroup=buildProceduralModel(type,machine.color);
    scene.add(toolGroup);
  }

  if(myToken!==loadToken)return;
  document.getElementById('loading').style.display='none';
  initChar();

  const arBtn=document.getElementById('ar-fab');
  if(arBtn&&mv&&mv.src&&(machine.glbUrl||machine.glbData)){
    arBtn.style.display='block';
  } else if(arBtn){arBtn.style.display='none';}

  setTimeout(()=>{speak(machine.desc);},1800);
}

// ─── INIT ─────────────────────────────────────────────────────────────
function init(){
  window.addEventListener('message',e=>{
    if(e.data?.type==='MACHINE_DATA'){
      document.getElementById('viewer-wrap').classList.add('active');
      document.getElementById('gallery-view').classList.remove('active');
      loadMachine(e.data.machine);
    }
    if(e.data?.type==='REQUEST_MACHINE'&&e.data.id){
      getMachineFromStorage(e.data.id).then(m=>{
        if(m)window.parent.postMessage({type:'MACHINE_DATA',machine:m},'*');
      });
    }
  });

  if(machineId){
    // MODO QR: mostrar nodo específico
    document.getElementById('viewer-wrap').classList.add('active');
    document.getElementById('gallery-view').classList.remove('active');
    document.getElementById('repeat-btn').style.display='block';

    if(isPreview&&window.parent!==window){
      document.getElementById('loading').style.display='flex';
      window.parent.postMessage({type:'REQUEST_MACHINE',id:machineId},'*');
    } else {
      getMachineFromStorage(machineId).then(m=>{
        if(m){loadMachine(m);}
        else{
          document.getElementById('loading').style.display='none';
          document.getElementById('error-state').classList.add('show');
        }
      });
    }
  } else if(!isPreview){
    // MODO GALERÍA: sin ?id=, mostrar todos los nodos
    initGallery();
  }

  if(window.speechSynthesis)window.speechSynthesis.getVoices();
}

init();
</script>
